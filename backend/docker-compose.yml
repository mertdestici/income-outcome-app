services:
  postgres:
    image: postgres:17-alpine
    container_name: income_outcome_db
    environment:
      POSTGRES_DB: income_outcome_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d income_outcome_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
