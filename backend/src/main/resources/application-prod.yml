spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGIN}
  storage:
    upload-dir: ${UPLOAD_DIR:/data/income-outcome-uploads}
    type: ${STORAGE_TYPE:local}
    bucket: ${S3_BUCKET:income-outcome-files}
    region: ${AWS_REGION:eu-central-1}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

spring:
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      "[mail.smtp.starttls.enable]": true

logging:
  level:
    com.incomeoutcome: INFO
    org.springframework.security: WARN
  pattern:
    console: '{"time":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","logger":"%logger{36}","msg":"%m"}%n'
